name: Extract MargyT

on:
  workflow_dispatch:
  push:
    paths:
      - "margyt.zip"
      - ".github/workflows/extract-htmlwidgets.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract MargyT ZIP
        run: |
          mkdir -p MargyT-source
          unzip -o margyt.zip -d MargyT-source

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add MargyT-source

          if ! git diff --cached --quiet; then
            git commit -m "Extract MargyT plugin SDK"
            git push
          else
            echo "No changes to commit"
          fi