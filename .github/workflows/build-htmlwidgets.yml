
name: Build HTML Widgets

on:
  workflow_dispatch:
  push:
    paths:
      - "HtmlWidgets/**"
      - ".github/workflows/build-htmlwidgets.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out plugin source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Get MargyT build tools
        run: git clone --depth 1 https://github.com/xzwew/MargyT.git MargyT

      - name: Build HTML Widgets
        working-directory: MargyT
        run: |
          mkdir -p examples/htmlwidgets
          cp -R ../HtmlWidgets/. examples/htmlwidgets/

          python3 -m margyt.plugin examples/htmlwidgets

          mkdir -p ../dist
          cp examples/htmlwidgets/*.mtp ../dist/

          test -n "$(find ../dist -name '*.mtp' -print -quit)"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: HTML-Widgets
          path: dist/*.mtp
          if-no-files-found: error
